
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Universe - Chapters</title>
    <link rel="stylesheet" href="css/book.css">
</head>

<body>

    <main class="book-screen">

        <header class="book-header">
            <a href="index.html" class="home-link">← HOME</a>
            <span>PAPER UNIVERSE</span>
            <span class="page-counter" id="pageCounter">01 / 03</span>
        </header>

        <section class="book-stage">

            <div class="storybook" id="storybook">

                <!-- Left page -->
                <div class="left-page">
                    <div class="page-inner">
                        <span class="small-label">A NEW ADVENTURE</span>
                        <h1 id="chapterNumber">CHAPTER 01</h1>
                        <div class="page-divider">✦ ✧ ✦</div>
                        <h2 id="chapterTitle">Living World</h2>
                        <p id="chapterDescription">
                            Discover a little world where plants grow,
                            nature responds, and tiny wonders come to life.
                        </p>
                        <span class="page-note">Turn the page to explore more.</span>
                    </div>
                </div>

                
                
                <!-- Right page -->
                <div class="right-page">
                    <a href="living-world/index.html"
                    class="chapter-preview-link"
                    id="chapterPreviewLink">

                    <img
                        src="assets/living-world-preview.png"
                        alt="Living World Preview"
                        class="chapter-preview-image"
                        id="chapterPreviewImage"
                    >

                    <h2 id="chapterPreviewTitle">Living World</h2>
                    <p id="chapterPreviewHint">Click to explore this world ✧</p>

                </a>

            </div>



                <!-- Animated page -->
                <div class="turn-page" id="turnPage">
                    <div class="turn-front"></div>
                    <div class="turn-back"></div>
                </div>

            </div>

        </section>

        <section class="book-controls">

            <button id="prevButton" class="nav-button">
                ← Previous
            </button>

            <button id="nextButton" class="nav-button">
                Next Page →
            </button>

        </section>

        <footer class="book-footer">
            Every page opens a new little world.
        </footer>

    </main>

    <script src="js/book.js"></script>

</body>
</html>
