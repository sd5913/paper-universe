<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#FDFBF5;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;font-family:Georgia,serif;overflow:hidden}
canvas{display:block}

<body>
<script>
// ===== CONFIG (Secret World subset) =====
const CONFIG={CANVAS_W:900,CANVAS_H:600,PALETTE:{
  paper:'#FDFBF5',paperShadow:'#E8E0D0',ink:'#3D3833',inkSoft:'#7A7268',
  accent:'#FF8E8E',accentWarm:'#FFB84D',
}};
const STATE={discoveries:new Set(),discoveryCount:0,notifications:[],showJournal:false,showHelp:false,debugMode:false};
const EventBus={_events:{},on(e,cb){(this._events[e]=this._events[e]||[]).push(cb)},emit(e,d){(this._events[e]||[]).forEach(cb=>cb(d))},clear(){this._events={}}};
function notify(t,c){STATE.notifications.push({text:t,life:3,maxLife:3,color:c||CONFIG.PALETTE.accent})}

const SECRETS=[
  {id:'door_found',name:'错位之门',hint:'画布上有一扇纸雕拱门',tier:1},
  {id:'crystal_glow',name:'水晶觉醒',hint:'点击发光的几何矿石',tier:1},
  {id:'compass_found',name:'星图罗盘',hint:'找到带有纸质指针的罗盘',tier:1},
  {id:'envelope_found',name:'虚空信封',hint:'发现撕裂边缘的黑色信封',tier:1},
  {id:'door_drag',name:'门扉错位',hint:'拖动门的把手',tier:2},
  {id:'crystal_charge',name:'聚能水晶',hint:'长按水晶使其充能',tier:2},
  {id:'compass_45',name:'四十五度',hint:'旋转罗盘指针至45度',tier:2},
  {id:'envelope_devour',name:'初次吞噬',hint:'将物品拖入黑洞信封',tier:2},
  {id:'spatial_fold',name:'空间折叠',hint:'将水晶嵌入错位之门',tier:3},
  {id:'symbol_awaken',name:'符号觉醒',hint:'罗盘指向特定角度时浮现暗纹',tier:3},
  {id:'dimension_devour',name:'维度吞噬',hint:'信封吞噬物体后吐出变异剪纸',tier:3},
  {id:'mandala',name:'秘密曼陀罗',hint:'触发两个以上组合反应',tier:4},
];

// ===== Easing (AI-assisted) =====
const EaseOutCubic=t=>1-Math.pow(1-t,3);
const EaseInOutCubic=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const EaseOutBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const EaseOutElastic=t=>{if(t===0||t===1)return t;const c4=(2*Math.PI)/3;return Math.pow(2,-10*t)*Math.sin((t*10-0.75)*c4)+1};

const SECRET_NODES=[
  {id:'door_found',tx:0.15,ty:0.25},{id:'crystal_glow',tx:0.38,ty:0.25},
  {id:'compass_found',tx:0.62,ty:0.25},{id:'envelope_found',tx:0.85,ty:0.25},
  {id:'door_drag',tx:0.15,ty:0.50},{id:'crystal_charge',tx:0.38,ty:0.50},
  {id:'compass_45',tx:0.62,ty:0.50},{id:'envelope_devour',tx:0.85,ty:0.50},
  {id:'spatial_fold',tx:0.25,ty:0.75},{id:'symbol_awaken',tx:0.50,ty:0.75},
  {id:'dimension_devour',tx:0.75,ty:0.75},{id:'mandala',tx:0.50,ty:0.92},
];
const SECRET_LINKS=[[0,4],[1,5],[2,6],[3,7],[4,8],[5,8],[6,9],[7,10],[8,11],[9,11],[10,11]];
const TIER_COLORS=['','#FFB84D','#6BCBEF','#C77DFF','#FF6B6B'];
const TIER_NAMES=['','初遇元素','元素操控','组合反应','最终转变'];
const SPIT_TYPES=[{name:'折纸翅膀',color:'#C77DFF'},{name:'发光水母',color:'#6BCBEF'},{name:'纸蝶',color:'#FFB84D'},{name:'星形碎片',color:'#FF6B6B'}];
</script>
<script>
// ===== SecretsModule =====
class SecretsModule{
  constructor(){
    this.discovered=new Set();this.sparkles=[];this.flash=null;this.splash=null;
    this.door={x:180,y:300,w:90,h:130,handleX:180,handleY:360,shift:0,targetShift:0,dragging:false,dragOffsetX:0,found:false,openAmount:0};
    this.crystal={x:450,y:290,size:28,glow:0,charge:0,charging:false,dragging:false,dragOffsetX:0,dragOffsetY:0,found:false,homeX:450,homeY:290,vx:0,vy:0};
    this.compass={x:720,y:230,r:38,angle:0,targetAngle:0,dragging:false,lastDragAngle:0,found:false,hiddenLayerAlpha:0,awakenTriggered:false};
    this.envelope={x:450,y:480,w:80,h:55,found:false,devourAmount:0,devourTarget:null,spitOut:null,tearProgress:0};
    this.reactions={spatial_fold:false,dimension_devour:false,symbol_awaken:false};
    this.reactionCount=0;this.negativeAmount=0;
    this.mandalaState='idle';this.mandalaTimer=0;this.confetti=[];this.mandalaParts=[];this.blowForce={x:0,y:0};
    this.spitOuts=[];this.hiddenGlyphs=[];this._initHiddenGlyphs();
  }
  _initHiddenGlyphs(){
    for(let i=0;i<6;i++)this.hiddenGlyphs.push({x:100+random(700),y:80+random(300),type:floor(random(3)),rotation:random(TWO_PI),scale:0.6+random(0.6)});
  }
  init(){this._loadProgress()}
  update(dt){
    this.door.shift+=(this.door.targetShift-this.door.shift)*min(1,dt*8);
    if(!this.door.dragging)this.door.targetShift*=max(0,1-dt*2);
    if(this.crystal.glow>0&&!this.crystal.found){this.crystal.found=true;this._tryDiscover('crystal_glow')}
    if(this.crystal.charging){this.crystal.charge=min(1,this.crystal.charge+dt*0.8);if(this.crystal.charge>=1&&!this.discovered.has('crystal_charge'))this._tryDiscover('crystal_charge')}
    else this.crystal.charge=max(0,this.crystal.charge-dt*0.3);
    if(this.crystal.dragging){this.crystal.x=mouseX-this.crystal.dragOffsetX;this.crystal.y=mouseY-this.crystal.dragOffsetY}
    else{let dx=this.crystal.homeX-this.crystal.x,dy=this.crystal.homeY-this.crystal.y;this.crystal.vx+=dx*dt*12;this.crystal.vy+=dy*dt*12;this.crystal.vx*=0.82;this.crystal.vy*=0.82;this.crystal.x+=this.crystal.vx*dt;this.crystal.y+=this.crystal.vy*dt}
    this.compass.angle+=(this.compass.targetAngle-this.compass.angle)*min(1,dt*10);
    let na=((this.compass.angle%360)+360)%360;
    let at45=abs(na-45)<8||abs(na-225)<8;
    let at180=abs(na-180)<8||abs(na-0)<8&&this.compass.angle!==0;
    if((at45||at180)&&this.compass.found&&!this.reactions.symbol_awaken){this.compass.hiddenLayerAlpha=min(1,this.compass.hiddenLayerAlpha+dt*0.6);if(this.compass.hiddenLayerAlpha>=0.9)this._triggerReaction('symbol_awaken')}
    else if(!this.reactions.symbol_awaken)this.compass.hiddenLayerAlpha=max(0,this.compass.hiddenLayerAlpha-dt*0.4);
    if(this.reactions.spatial_fold)this.negativeAmount=min(1,this.negativeAmount+dt*0.5);else this.negativeAmount=max(0,this.negativeAmount-dt*0.8);
    if(this.reactions.spatial_fold)this.door.openAmount=min(1,this.door.openAmount+dt*0.6);
    if(this.envelope.devourTarget){this.envelope.devourAmount=min(1,this.envelope.devourAmount+dt*1.5);if(this.envelope.devourAmount>=1)this._completeDevour()}
    for(let i=this.spitOuts.length-1;i>=0;i--){let s=this.spitOuts[i];s.y+=s.vy*dt;s.vy+=40*dt;s.rotation+=s.rotSpeed*dt;s.life-=dt*0.15;if(s.life<=0)this.spitOuts.splice(i,1)}
    this._updateMandala(dt);this._checkReactions();
    if(this.reactionCount>=2&&this.mandalaState==='idle')this._triggerMandala();
    for(let i=this.sparkles.length-1;i>=0;i--){let s=this.sparkles[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=60*dt;s.life-=dt*1.5;if(s.life<=0)this.sparkles.splice(i,1)}
    if(this.flash){this.flash.alpha-=dt*2.5;if(this.flash.alpha<=0)this.flash=null}
    if(this.splash){this.splash.scale+=dt*3;if(this.splash.scale>1.1){this.splash.alpha-=dt*1.5;if(this.splash.alpha<=0)this.splash=null}}
  }
  draw(){
    if(this.compass.hiddenLayerAlpha>0)this._drawHiddenLayer();
    this._drawEnvelope();this._drawDoor();this._drawCrystal();this._drawCompass();
    this._drawSpitOuts();
    if(this.mandalaState!=='idle')this._drawMandala();
    noStroke();
    for(let s of this.sparkles){fill(s.color[0],s.color[1],s.color[2],s.life*220);circle(s.x,s.y,s.r*s.life)}
  }
  _drawDoor(){
    let d=this.door,dx=d.x+d.shift;push();translate(dx,d.y);
    if(d.openAmount>0){noStroke();for(let i=5;i>0;i--){fill(107,203,239,d.openAmount*15);rect(-d.w/2-i*3,-d.h/2-i*3,d.w+i*6,d.h+i*6,8+i)}}
    noStroke();fill(0,0,0,25);rect(-d.w/2+3,-d.h/2+3,d.w,d.h,12,12,8,8);
    fill(120,100,80,200);rect(-d.w/2,-d.h/2,d.w,d.h,12,12,8,8);
    fill(140,120,95,180);rect(-d.w/2+4,-d.h/2+4,d.w-8,d.h-8,10,10,6,6);
    stroke(100,85,65,80);strokeWeight(1);for(let i=-2;i<=2;i++)line(i*16,-d.h/2+8,i*16,d.h/2-8);noStroke();
    if(d.openAmount>0){let ow=d.w*0.6*d.openAmount;fill(20,20,50,d.openAmount*200);rect(-ow/2,-d.h/2+10,ow,d.h-20,6);fill(255,255,200,d.openAmount*180);for(let i=0;i<12;i++){let sx=sin(frameCount*0.02+i*1.7)*ow*0.35,sy=cos(frameCount*0.03+i*2.1)*(d.h*0.3);circle(sx,sy,1+(i%3))}}
    let hx=d.w/2-8,hy=0,hg=d.dragging?1:0.5;
    fill(180,150,100,hg*100);circle(hx,hy,14);fill(200,170,110,220);circle(hx,hy,9);fill(240,220,160,hg*150);circle(hx,hy,5);
    if(!d.found){let p=constrain(1-dist(mouseX,mouseY,dx,d.y)/80,0,1);if(p>0.2){fill(255,184,77,p*30);circle(0,0,d.w+20)}}
    pop();
  }
  _drawCrystal(){
    let c=this.crystal;push();translate(c.x,c.y);
    let tg=c.glow+c.charge,pulse=0.7+0.3*sin(frameCount*0.06);
    if(tg>0){noStroke();for(let i=4;i>0;i--){fill(107,203,239,tg*pulse*20/i);circle(0,0,c.size+i*12)}}
    let s=c.size;fill(0,0,0,30);beginShape();vertex(2,-s+2);vertex(s*0.7+2,2);vertex(2,s+2);vertex(-s*0.7+2,2);endShape(CLOSE);
    fill(150,210,240,100+tg*100);beginShape();vertex(0,-s);vertex(s*0.7,0);vertex(0,s);vertex(-s*0.7,0);endShape(CLOSE);
    stroke(80,160,210,120);strokeWeight(1);line(0,-s,0,s);line(-s*0.7,0,s*0.7,0);line(0,-s,-s*0.35,0);line(0,-s,s*0.35,0);noStroke();
    fill(220,240,255,tg*150);beginShape();vertex(0,-s*0.7);vertex(s*0.25,-s*0.2);vertex(0,0);vertex(-s*0.25,-s*0.2);endShape(CLOSE);
    if(c.charge>0){noFill();stroke(107,203,239,c.charge*200);strokeWeight(2);let rr=s+6+c.charge*8;arc(0,0,rr*2,rr*2,-HALF_PI,-HALF_PI+c.charge*TWO_PI);noStroke()}
    if(!c.found){let p=constrain(1-dist(mouseX,mouseY,c.x,c.y)/60,0,1);if(p>0.2){fill(107,203,239,p*25*pulse);circle(0,0,s+16)}}
    pop();
  }
  _drawCompass(){
    let cp=this.compass;push();translate(cp.x,cp.y);
    if(cp.found){noStroke();fill(199,125,255,12);circle(0,0,cp.r*2.6)}
    fill(0,0,0,25);circle(2,2,cp.r*2);fill(200,190,170,220);circle(0,0,cp.r*2);fill(220,210,190,200);circle(0,0,cp.r*1.7);
    stroke(120,110,90,150);strokeWeight(1);
    for(let i=0;i<360;i+=15){let a=radians(i),r1=cp.r*0.75,r2=i%45===0?cp.r*0.85:cp.r*0.8;line(cos(a)*r1,sin(a)*r1,cos(a)*r2,sin(a)*r2)}
    noStroke();fill(199,125,255,cp.found?180:60);
    for(let deg of[45,225]){let a=radians(deg);circle(cos(a)*cp.r*0.82,sin(a)*cp.r*0.82,4)}
    let pa=radians(cp.angle);push();rotate(pa);
    fill(0,0,0,40);triangle(2,-2,cp.r*0.6+2,2,2,8);triangle(2,-2,-cp.r*0.6+2,2,2,8);
    fill(180,60,60,220);triangle(0,-3,cp.r*0.6,0,0,3);fill(60,60,140,220);triangle(0,-3,-cp.r*0.6,0,0,3);pop();
    fill(100,90,70,200);circle(0,0,8);fill(200,180,140,200);circle(0,0,4);
    if(cp.found||cp.dragging){fill(CONFIG.PALETTE.ink);textSize(10);textAlign(CENTER,CENTER);textStyle(BOLD);let na=((cp.angle%360)+360)%360;text(floor(na)+'\u00b0',0,cp.r+14);textStyle(NORMAL)}
    if(!cp.found){let p=constrain(1-dist(mouseX,mouseY,cp.x,cp.y)/60,0,1);if(p>0.2){fill(199,125,255,p*20);circle(0,0,cp.r*2.2)}}
    pop();
  }
  _drawEnvelope(){
    let e=this.envelope;push();translate(e.x,e.y);
    if(e.devourAmount>0){noStroke();for(let i=5;i>0;i--){fill(60,0,80,e.devourAmount*30/i);circle(0,-5,e.w+i*14)}}
    fill(0,0,0,40);rect(-e.w/2+3,-e.h/2+3,e.w,e.h,4);
    fill(25,20,30,230);beginShape();
    let ts=12;for(let i=0;i<=ts;i++){let t=i/ts,x=-e.w/2+t*e.w,y=-e.h/2+sin(t*PI*4+frameCount*0.01)*2+(noise(t*5)-0.5)*4;vertex(x,y)}
    vertex(e.w/2,e.h/2);vertex(-e.w/2,e.h/2);endShape(CLOSE);
    fill(5,0,10,240);let iw=e.w*0.7,ih=e.h*0.4;rect(-iw/2,-e.h/2+6,iw,ih,3);
    let sw=0.5+0.5*sin(frameCount*0.04);fill(80,30,100,sw*40);circle(0,-e.h/2+12,iw*0.6*sw);
    stroke(60,50,70,100);strokeWeight(1);noFill();beginShape();
    for(let i=0;i<=ts;i++){let t=i/ts,x=-e.w/2+t*e.w,y=-e.h/2+sin(t*PI*4+frameCount*0.01)*2+(noise(t*5)-0.5)*4;vertex(x,y-1)}
    endShape();noStroke();
    if(!e.found){let p=constrain(1-dist(mouseX,mouseY,e.x,e.y)/60,0,1);if(p>0.2){fill(199,125,255,p*20);circle(0,0,e.w+16)}}
    pop();
  }
  _drawHiddenLayer(){
    let a=this.compass.hiddenLayerAlpha;push();noStroke();
    for(let g of this.hiddenGlyphs){push();translate(g.x,g.y);rotate(g.rotation);let s=20*g.scale,al=a*60;
      if(g.type===0){fill(100,80,60,al);beginShape();vertex(0,-s);vertex(s*0.6,-s*0.3);vertex(s*0.5,s*0.4);vertex(0,s);vertex(-s*0.5,s*0.4);vertex(-s*0.6,-s*0.3);endShape(CLOSE);fill(60,40,30,al*1.5);circle(0,-s*0.3,s*0.3)}
      else if(g.type===1){stroke(100,80,60,al*2);strokeWeight(1.5);noFill();for(let r=s*0.3;r<s;r+=s*0.25)rect(-r,-r,r*2,r*2);noStroke()}
      else{fill(100,80,60,al);for(let i=0;i<6;i++){let ang=i*PI/3;circle(cos(ang)*s*0.5,sin(ang)*s*0.5,s*0.25)}fill(60,40,30,al*1.5);circle(0,0,s*0.3)}
    pop()}pop();
  }
  _drawSpitOuts(){
    for(let s of this.spitOuts){push();translate(s.x,s.y);rotate(s.rotation);let al=constrain(s.life,0,1)*220,rgb=this._hexToRgb(s.color);noStroke();fill(rgb.r,rgb.g,rgb.b,al);
      if(s.type===0){beginShape();vertex(0,0);vertex(s.size,-s.size*0.3);vertex(s.size*0.8,s.size*0.2);vertex(0,s.size*0.5);vertex(-s.size*0.8,s.size*0.2);vertex(-s.size,-s.size*0.3);endShape(CLOSE)}
      else if(s.type===1){arc(0,0,s.size*1.5,s.size*1.5,PI,0);for(let i=-2;i<=2;i++){let tx=i*s.size*0.25;rect(tx-1,0,2,s.size*0.6,1)}}
      else if(s.type===2){ellipse(-s.size*0.3,0,s.size*0.6,s.size*0.8);ellipse(s.size*0.3,0,s.size*0.6,s.size*0.8);fill(40,40,40,al);rect(-1,-s.size*0.3,2,s.size*0.6)}
      else{beginShape();for(let i=0;i<10;i++){let rad=i%2===0?s.size:s.size*0.45,a=-HALF_PI+i*PI/5;vertex(cos(a)*rad,sin(a)*rad)}endShape(CLOSE)}
    pop()}
  }
  _triggerMandala(){
    this.mandalaState='exploding';this.mandalaTimer=0;this.confetti=[];
    for(let i=0;i<120;i++){let a=random(TWO_PI),sp=random(100,350);this.confetti.push({x:CONFIG.CANVAS_W/2,y:CONFIG.CANVAS_H/2,vx:cos(a)*sp,vy:sin(a)*sp-80,size:random(4,12),rotation:random(TWO_PI),rotSpeed:random(-8,8),color:random([255,184,77,107,203,239,199,125,255,255,107,107]),life:1})}
    this._tryDiscover('mandala');notify('\u2726 纸张大爆炸！秘密曼陀罗正在重组…',TIER_COLORS[4]);
  }
  _updateMandala(dt){
    if(this.mandalaState==='idle')return;this.mandalaTimer+=dt;
    if(this.mandalaState==='exploding'){
      for(let c of this.confetti){c.x+=c.vx*dt;c.y+=c.vy*dt;c.vy+=200*dt;c.vx*=0.98;c.rotation+=c.rotSpeed*dt;c.life=max(0,c.life-dt*0.2)}
      if(this.mandalaTimer>2.5){this.mandalaState='reassembling';this.mandalaTimer=0;this.mandalaParts=[];
        for(let l=0;l<4;l++){let count=6+l*3,radius=40+l*35;for(let i=0;i<count;i++){let a=(i/count)*TWO_PI;this.mandalaParts.push({angle:a,radius:radius,layer:l,size:14-l*2,phase:random(TWO_PI),x:CONFIG.CANVAS_W/2+cos(a)*400,y:CONFIG.CANVAS_H/2+sin(a)*400,targetX:CONFIG.CANVAS_W/2+cos(a)*radius,targetY:CONFIG.CANVAS_H/2+sin(a)*radius,dispersX:0,dispersY:0})}}
      }
    }else if(this.mandalaState==='reassembling'){
      let t=min(1,this.mandalaTimer/1.5),e=EaseOutCubic(t);
      for(let p of this.mandalaParts){p.x=lerp(CONFIG.CANVAS_W/2+cos(p.angle)*400,p.targetX,e);p.y=lerp(CONFIG.CANVAS_H/2+sin(p.angle)*400,p.targetY,e)}
      if(this.mandalaTimer>1.5){this.mandalaState='active';this.mandalaTimer=0;notify('\u2726 秘密曼陀罗已现！鼠标移动可吹散它',TIER_COLORS[3])}
    }else if(this.mandalaState==='active'){
      for(let p of this.mandalaParts){p.angle+=dt*0.3;let md=dist(mouseX,mouseY,CONFIG.CANVAS_W/2,CONFIG.CANVAS_H/2);
        if(md<120){let blow=(120-md)/120;p.dispersX+=(mouseX-pmouseX)*blow*0.5;p.dispersY+=(mouseY-pmouseY)*blow*0.5}
        p.dispersX*=0.95;p.dispersY*=0.95;p.x=CONFIG.CANVAS_W/2+cos(p.angle)*p.radius+p.dispersX;p.y=CONFIG.CANVAS_H/2+sin(p.angle)*p.radius+p.dispersY;p.phase+=dt*2}
    }
  }
  _drawMandala(){
    push();translate(CONFIG.CANVAS_W/2,CONFIG.CANVAS_H/2);
    if(this.mandalaState==='exploding'){noStroke();for(let c of this.confetti){push();translate(c.x-CONFIG.CANVAS_W/2,c.y-CONFIG.CANVAS_H/2);rotate(c.rotation);fill(c.color,c.color,c.color,c.life*200);triangle(0,-c.size/2,c.size/2,c.size/2,-c.size/2,c.size/2);pop()}}
    else if(this.mandalaState==='reassembling'||this.mandalaState==='active'){
      if(this.mandalaState==='active'){noStroke();for(let i=8;i>0;i--){fill(255,240,180,8);circle(0,0,60+i*30)}}
      noStroke();let cols=['#FFB84D','#6BCBEF','#C77DFF','#FF6B6B'];
      for(let p of this.mandalaParts){push();translate(p.x-CONFIG.CANVAS_W/2,p.y-CONFIG.CANVAS_H/2);rotate(p.angle+p.phase*0.3);
        let c=this._hexToRgb(cols[p.layer%4]),pulse=0.7+0.3*sin(p.phase);
        fill(c.r,c.g,c.b,pulse*200);triangle(0,-p.size,p.size*0.87,p.size*0.5,-p.size*0.87,p.size*0.5);
        fill(c.r,c.g,c.b,pulse*80);circle(0,0,p.size*2.5);pop()}
    }
    pop();
  }
  _checkReactions(){
    if(!this.reactions.spatial_fold){let d=dist(this.crystal.x,this.crystal.y,this.door.x+this.door.shift,this.door.y);if(d<70&&this.crystal.found)this._triggerReaction('spatial_fold')}
    if(!this.reactions.dimension_devour){let d=dist(this.crystal.x,this.crystal.y,this.envelope.x,this.envelope.y);if(d<45&&this.crystal.dragging){this.envelope.devourTarget='crystal';this.envelope.devourAmount=0;this.crystal.dragging=false;this.crystal.x=this.envelope.x;this.crystal.y=this.envelope.y;notify('黑洞信封吸入了水晶…','#C77DFF')}}
  }
  _triggerReaction(rid){
    if(this.reactions[rid])return;this.reactions[rid]=true;this.reactionCount++;
    if(rid==='spatial_fold'){this._tryDiscover('spatial_fold');this.negativeAmount=0.01;this.crystal.dragging=false;this.crystal.vx=-200;this.crystal.vy=-100;notify('\u2726 空间折叠！门后是微型星空…',TIER_COLORS[3])}
    else if(rid==='symbol_awaken'){this._tryDiscover('symbol_awaken');notify('\u2726 符号觉醒！羊皮纸上浮现暗纹…',TIER_COLORS[3])}
    else if(rid==='dimension_devour'){this._tryDiscover('dimension_devour');notify('\u2726 维度吞噬！信封吐出变异剪纸…',TIER_COLORS[3])}
  }
  _completeDevour(){
    let st=floor(random(4)),si=SPIT_TYPES[st];
    this.spitOuts.push({x:this.envelope.x,y:this.envelope.y-20,vx:random(-60,60),vy:-150,size:16+random(8),type:st,color:si.color,rotation:0,rotSpeed:random(-4,4),life:1});
    this._spawnSparkles(this.envelope.x,this.envelope.y,'#C77DFF');
    this.envelope.devourTarget=null;this.envelope.devourAmount=0;
    this.crystal.x=this.crystal.homeX;this.crystal.y=this.crystal.homeY;this.crystal.vx=0;this.crystal.vy=0;
    this._triggerReaction('dimension_devour');this._tryDiscover('envelope_devour');
  }
  handlePress(x,y){
    let h=false;
    if(dist(x,y,this.crystal.x,this.crystal.y)<this.crystal.size+8){
      if(!this.crystal.found){this.crystal.found=true;this._tryDiscover('crystal_glow');this._tryDiscover('door_found');this._tryDiscover('compass_found');this._tryDiscover('envelope_found')}
      this.crystal.glow=max(this.crystal.glow,0.5);this.crystal.dragging=true;this.crystal.dragOffsetX=x-this.crystal.x;this.crystal.dragOffsetY=y-this.crystal.y;this.crystal.charging=true;h=true}
    else if(dist(x,y,this.door.x+this.door.shift+this.door.w/2-8,this.door.y)<18){this.door.dragging=true;this.door.dragOffsetX=x-this.door.shift;if(!this.door.found){this.door.found=true;this._tryDiscover('door_found')}h=true}
    else if(dist(x,y,this.compass.x,this.compass.y)<this.compass.r){this.compass.dragging=true;this.compass.lastDragAngle=degrees(atan2(y-this.compass.y,x-this.compass.x));if(!this.compass.found){this.compass.found=true;this._tryDiscover('compass_found')}h=true}
    else if(dist(x,y,this.envelope.x,this.envelope.y)<50){if(!this.envelope.found){this.envelope.found=true;this._tryDiscover('envelope_found');this._spawnSparkles(this.envelope.x,this.envelope.y,'#C77DFF')}h=true}
    if(h&&this.discovered.size===0){this._tryDiscover('door_found');this._tryDiscover('crystal_glow');this._tryDiscover('compass_found');this._tryDiscover('envelope_found')}
    return h;
  }
  handleDrag(x,y,dx,dy){
    if(this.door.dragging){this.door.targetShift=constrain(x-this.door.dragOffsetX,-40,40);if(abs(this.door.targetShift)>15&&!this.discovered.has('door_drag'))this._tryDiscover('door_drag')}
    if(this.compass.dragging){let ca=degrees(atan2(y-this.compass.y,x-this.compass.x)),delta=ca-this.compass.lastDragAngle;if(delta>180)delta-=360;if(delta<-180)delta+=360;this.compass.targetAngle+=delta;this.compass.lastDragAngle=ca;let na=((this.compass.targetAngle%360)+360)%360;if((abs(na-45)<8||abs(na-225)<8)&&!this.discovered.has('compass_45'))this._tryDiscover('compass_45')}
    if(this.crystal.dragging&&(abs(dx)>1||abs(dy)>1))this.crystal.charging=false;
  }
  handleRelease(){this.door.dragging=false;this.compass.dragging=false;this.crystal.dragging=false;this.crystal.charging=false}
  handleDoubleClick(x,y){
    if(dist(x,y,this.crystal.x,this.crystal.y)<this.crystal.size+8){this.crystal.glow=min(1,this.crystal.glow+0.3);this._spawnSparkles(this.crystal.x,this.crystal.y,'#6BCBEF');return true}
    if(dist(x,y,this.envelope.x,this.envelope.y)<50){this.envelope.tearProgress=min(1,this.envelope.tearProgress+0.3);this._spawnSparkles(this.envelope.x,this.envelope.y,'#C77DFF');return true}
    return false;
  }
  drawFlash(){if(!this.flash)return;let f=this.flash;noStroke();for(let i=0;i<25;i++){let t=i/25,a=f.alpha*(1-t)*50;fill(f.r,f.g,f.b,a);let ins=i*7;rect(ins,ins,CONFIG.CANVAS_W-ins*2,CONFIG.CANVAS_H-ins*2)}}
  drawSplash(){if(!this.splash)return;let s=this.splash,sc=min(s.scale,1),a=s.alpha;push();translate(CONFIG.CANVAS_W/2,CONFIG.CANVAS_H/2);scale(sc);noStroke();fill(0,0,0,a*120);rect(-210,-45,420,90,14);noFill();let bc=color(s.color);bc.setAlpha(a*220);stroke(bc);strokeWeight(2);rect(-210,-45,420,90,14);noStroke();let tc=color(s.color);tc.setAlpha(a*255);fill(tc);textSize(26);textAlign(CENTER,CENTER);textStyle(BOLD);text('\u2726 '+s.name,0,-10);textStyle(NORMAL);fill(255,255,255,a*180);textSize(13);text('Tier '+s.tier+' \u00b7 '+TIER_NAMES[s.tier],0,18);pop()}
  drawJournal(){
    let pw=460,ph=480,px=(CONFIG.CANVAS_W-pw)/2,py=(CONFIG.CANVAS_H-ph)/2;
    noStroke();fill(0,0,0,140);rect(0,0,CONFIG.CANVAS_W,CONFIG.CANVAS_H);
    fill(0,0,0,40);rect(px+5,py+5,pw,ph,14);fill(CONFIG.PALETTE.paper);rect(px,py,pw,ph,14);
    noFill();stroke(CONFIG.PALETTE.accent);strokeWeight(2);rect(px,py,pw,ph,14);noStroke();
    fill(CONFIG.PALETTE.ink);textSize(22);textAlign(CENTER,TOP);textStyle(BOLD);text('\u2726 秘密星图',px+pw/2,py+16);textStyle(NORMAL);
    let prog=this.getProgress();textSize(12);fill(CONFIG.PALETTE.inkSoft);text('已点亮 '+prog.found+' / '+prog.total+' 颗星',px+pw/2,py+46);
    let bw=pw-80,bx=px+40,by=py+66;fill(210,205,195);rect(bx,by,bw,4,2);fill(CONFIG.PALETTE.accent);rect(bx,by,bw*(prog.found/prog.total),4,2);
    let cY=py+88,cH=ph-110;
    for(let link of SECRET_LINKS){let n1=SECRET_NODES[link[0]],n2=SECRET_NODES[link[1]],x1=px+n1.tx*pw,y1=cY+n1.ty*cH,x2=px+n2.tx*pw,y2=cY+n2.ty*cH,f1=this.discovered.has(n1.id),f2=this.discovered.has(n2.id);
      if(f1&&f2){stroke(255,200,100,160);strokeWeight(2);line(x1,y1,x2,y2);stroke(255,200,100,40);strokeWeight(5);line(x1,y1,x2,y2)}
      else{stroke(170,165,155,50);strokeWeight(1);drawingContext.setLineDash([4,4]);line(x1,y1,x2,y2);drawingContext.setLineDash([])}}
    noStroke();
    for(let i=0;i<SECRET_NODES.length;i++){let node=SECRET_NODES[i],secret=SECRETS.find(s=>s.id===node.id);if(!secret)continue;let nx=px+node.tx*pw,ny=cY+node.ty*cH,found=this.discovered.has(node.id),tc=TIER_COLORS[secret.tier];
      if(found){let gl=color(tc);gl.setAlpha(35);fill(gl);circle(nx,ny,34);gl.setAlpha(70);fill(gl);circle(nx,ny,24);fill(tc);circle(nx,ny,16);fill(255,255,255,200);textSize(9);textAlign(CENTER,CENTER);textStyle(BOLD);text('\u2726',nx,ny);textStyle(NORMAL);fill(CONFIG.PALETTE.ink);textSize(9);textAlign(CENTER,TOP);text(secret.name,nx,ny+12)}
      else{fill(215,210,200);circle(nx,ny,12);noFill();stroke(170,165,155,120);strokeWeight(1);drawingContext.setLineDash([3,3]);circle(nx,ny,18);drawingContext.setLineDash([]);noStroke();fill(150,145,135);textSize(10);textAlign(CENTER,CENTER);textStyle(BOLD);text('?',nx,ny);textStyle(NORMAL);fill(CONFIG.PALETTE.inkSoft);textSize(8);textAlign(CENTER,TOP);textStyle(ITALIC);text(secret.hint,nx,ny+12);textStyle(NORMAL)}}
    let tYs=[0.25,0.50,0.75,0.92];for(let t=1;t<=4;t++){let ty=cY+tYs[t-1]*cH;fill(TIER_COLORS[t]);textSize(9);textAlign(LEFT,CENTER);textStyle(BOLD);text('T'+t,px+6,ty);textStyle(NORMAL)}
    fill(CONFIG.PALETTE.inkSoft);textSize(11);textAlign(CENTER,BOTTOM);text('按 J 或点击外部关闭',px+pw/2,py+ph-10);
  }
  _tryDiscover(id){
    if(this.discovered.has(id))return;this.discovered.add(id);STATE.discoveries.add(id);STATE.discoveryCount=this.discovered.size;
    let secret=SECRETS.find(s=>s.id===id);if(!secret)return;let tc=TIER_COLORS[secret.tier]||CONFIG.PALETTE.accent;
    notify('\u2726 发现：'+secret.name,tc);let rgb=this._hexToRgb(tc);
    this.flash={r:rgb.r,g:rgb.g,b:rgb.b,alpha:1};this.splash={name:secret.name,tier:secret.tier,color:tc,scale:0,alpha:1};
    this._spawnSparkles(CONFIG.CANVAS_W/2,60,tc);EventBus.emit('secret:discovered',{id:id,name:secret.name,tier:secret.tier});this._saveProgress();
  }
  _spawnSparkles(x,y,hex){let rgb=this._hexToRgb(hex);for(let i=0;i<18;i++){let a=random(TWO_PI),sp=random(80,200);this.sparkles.push({x:x,y:y,vx:cos(a)*sp,vy:sin(a)*sp-80,r:random(3,7),life:1,color:[rgb.r,rgb.g,rgb.b]})}}
  _hexToRgb(hex){if(!hex||typeof hex!=='string')return{r:255,g:107,b:107};let c=color(hex);return{r:red(c),g:green(c),b:blue(c)}}
  _saveProgress(){try{let d={secrets:[...this.discovered],doorFound:this.door.found,crystalFound:this.crystal.found,crystalGlow:this.crystal.glow,compassFound:this.compass.found,envelopeFound:this.envelope.found,reactions:{...this.reactions},reactionCount:this.reactionCount,mandalaState:this.mandalaState};localStorage.setItem('paper_universe_secrets_v3',JSON.stringify(d))}catch(e){}}
  _loadProgress(){try{let s=localStorage.getItem('paper_universe_secrets_v3');if(!s)return;let d=JSON.parse(s);if(d.secrets){d.secrets.forEach(id=>{this.discovered.add(id);STATE.discoveries.add(id)});STATE.discoveryCount=this.discovered.size}if(d.doorFound)this.door.found=true;if(d.crystalFound){this.crystal.found=true;this.crystal.glow=d.crystalGlow||0.5}if(d.compassFound)this.compass.found=true;if(d.envelopeFound)this.envelope.found=true;if(d.reactions){this.reactions={...this.reactions,...d.reactions};this.reactionCount=d.reactionCount||0}if(d.mandalaState)this.mandalaState=d.mandalaState}catch(e){}}
  getProgress(){return{found:this.discovered.size,total:SECRETS.length}}
  isDiscovered(id){return this.discovered.has(id)}
  reset(){this.discovered.clear();this.sparkles=[];this.flash=null;this.splash=null;this.door.found=false;this.door.shift=0;this.door.targetShift=0;this.door.openAmount=0;this.crystal.found=false;this.crystal.glow=0;this.crystal.charge=0;this.crystal.x=this.crystal.homeX;this.crystal.y=this.crystal.homeY;this.compass.found=false;this.compass.angle=0;this.compass.targetAngle=0;this.compass.hiddenLayerAlpha=0;this.compass.awakenTriggered=false;this.envelope.found=false;this.envelope.devourAmount=0;this.envelope.devourTarget=null;this.reactions={spatial_fold:false,dimension_devour:false,symbol_awaken:false};this.reactionCount=0;this.negativeAmount=0;this.mandalaState='idle';this.mandalaTimer=0;this.confetti=[];this.mandalaParts=[];this.spitOuts=[];STATE.discoveries.clear();STATE.discoveryCount=0;try{localStorage.removeItem('paper_universe_secrets_v3')}catch(e){}}
}
</script>
<script>
// ===== p5 lifecycle =====
let secrets;
function setup(){
  let c=createCanvas(CONFIG.CANVAS_W,CONFIG.CANVAS_H);
  c.parent(document.body);
  textFont('Georgia');
  secrets=new SecretsModule();
  secrets.init();
  setTimeout(()=>{notify('\u2726 欢迎来到秘密世界 — 点击画布上的元素开始探索',TIER_COLORS[1])},500);
}
function draw(){
  let dt=min(deltaTime/1000,0.05);
  background(CONFIG.PALETTE.paper);
  // parchment texture
  noStroke();fill(240,235,220,30);for(let i=0;i<30;i++){let x=(i*37+frameCount*0.1)%CONFIG.CANVAS_W,y=(i*53)%CONFIG.CANVAS_H;circle(x,y,2+(i%3))}
  // negative space effect
  if(secrets.negativeAmount>0){push();fill(255,255,255,secrets.negativeAmount*200);rect(0,0,CONFIG.CANVAS_W,CONFIG.CANVAS_H);pop()}
  secrets.update(dt);
  secrets.draw();
  secrets.drawFlash();
  secrets.drawSplash();
  // notifications
  let ny=20;
  for(let i=STATE.notifications.length-1;i>=0;i--){let n=STATE.notifications[i];n.life-=dt;if(n.life<=0){STATE.notifications.splice(i,1);continue}
    let a=min(1,n.life/0.5)*255;let sc=color(n.color);sc.setAlpha(a*0.3*255/255);
    noStroke();fill(0,0,0,a*0.15);rect(CONFIG.CANVAS_W/2-160,ny-2,320,28,6);
    fill(sc);textSize(14);textAlign(CENTER,CENTER);textStyle(BOLD);fill(n.color);text(n.text,CONFIG.CANVAS_W/2,ny+12);textStyle(NORMAL);ny+=34}
  // help panel
  if(STATE.showHelp){drawHelp()}
  // journal
  if(STATE.showJournal){secrets.drawJournal()}
  // top bar
  noStroke();fill(0,0,0,40);rect(0,0,CONFIG.CANVAS_W,32);
  fill(CONFIG.PALETTE.paper);textSize(13);textAlign(LEFT,CENTER);textStyle(BOLD);
  text('\u2726 秘密世界 Secret World',12,16);textStyle(NORMAL);
  let prog=secrets.getProgress();textAlign(RIGHT,CENTER);textSize(11);
  text('星星 '+prog.found+'/'+prog.total+'  |  J 星图  H 帮助  R 重置',CONFIG.CANVAS_W-12,16);
}
function drawHelp(){
  noStroke();fill(0,0,0,140);rect(0,0,CONFIG.CANVAS_W,CONFIG.CANVAS_H);
  let pw=420,ph=380,px=(CONFIG.CANVAS_W-pw)/2,py=(CONFIG.CANVAS_H-ph)/2;
  fill(CONFIG.PALETTE.paper);rect(px,py,pw,ph,14);
  noFill();stroke(CONFIG.PALETTE.accent);strokeWeight(2);rect(px,py,pw,ph,14);noStroke();
  fill(CONFIG.PALETTE.ink);textSize(18);textAlign(CENTER,TOP);textStyle(BOLD);text('\u2726 秘密世界 — 操作指南',px+pw/2,py+16);textStyle(NORMAL);
  let lines=[
    ['点击水晶','唤醒微光，可拖动'],
    ['拖动水晶靠近门','触发空间折叠'],
    ['将水晶拖入信封','触发维度吞噬'],
    ['旋转罗盘指针','指向45°或180°触发符号觉醒'],
    ['长按水晶','聚能充能'],
    ['双击元素','翻转/撕开效果'],
    ['触发2+反应','纸张大爆炸→秘密曼陀罗'],
    ['鼠标移动','吹散曼陀罗'],
    ['J 键','打开/关闭秘密星图'],
    ['R 键','重置进度'],
  ];
  textSize(12);textAlign(LEFT,TOP);
  for(let i=0;i<lines.length;i++){let ly=py+52+i*30;fill(CONFIG.PALETTE.accent);textStyle(BOLD);text(lines[i][0],px+30,ly);fill(CONFIG.PALETTE.inkSoft);textStyle(NORMAL);text(lines[i][1],px+170,ly)}
  fill(CONFIG.PALETTE.inkSoft);textSize(11);textAlign(CENTER,BOTTOM);text('按 H 关闭',px+pw/2,py+ph-10);
}
function mousePressed(){
  if(STATE.showJournal){STATE.showJournal=false;return}
  if(STATE.showHelp){STATE.showHelp=false;return}
  secrets.handlePress(mouseX,mouseY);
}
function mouseDragged(){secrets.handleDrag(mouseX,mouseY,mouseX-pmouseX,mouseY-pmouseY)}
function mouseReleased(){secrets.handleRelease()}
function doubleClicked(){secrets.handleDoubleClick(mouseX,mouseY)}
function keyPressed(){
  if(key==='j'||key==='J')STATE.showJournal=!STATE.showJournal;
  if(key==='h'||key==='H')STATE.showHelp=!STATE.showHelp;
  if(key==='r'||key==='R'){secrets.reset();notify('\u2726 秘密世界已重置',CONFIG.PALETTE.accent)}
}
</script>
</body>
</html>
