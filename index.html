
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Paper Universe</title>

    <link rel="stylesheet" href="css/homepage.css">
</head>

<body>

    <main class="home-screen">

        <!-- Header -->
        <header class="header">
            <h1>PAPER UNIVERSE</h1>
            <span>A WORLD OF WONDERS</span>
        </header>

        <!-- Welcome -->
        <section class="welcome">
            <h2>Welcome to<br>Paper Universe!</h2>

            <p>
                Choose a world and discover something unexpected.
            </p>
        </section>

        <!-- World Selection -->
        <section class="world-selection">

            <a href="weather-world/index.html"
               class="world-card weather">

                <img src="assets/weather-entry.png"
                     alt="Paper sun">

                <h3>Weather World</h3>
                <p>Explore the sky</p>
            </a>

            <a href="living-world/index.html"
               class="world-card living">

                <img src="assets/living-entry.png"
                     alt="Paper leaf">

                <h3>Living World</h3>
                <p>Discover life</p>
            </a>

            <a href="secret-world/index.html"
               class="world-card secret">

                <img src="assets/secret-entry.png"
                     alt="Secret paper door">

                <h3>Secret World</h3>
                <p>Find the unknown</p>
            </a>

        </section>

        <!-- Footer -->
        <footer>
            Click an entrance to begin your adventure.
        </footer>

    </main>

    <script src="js/homepage.js"></script>

</body>
</html>
